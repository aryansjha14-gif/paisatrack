name: netlify-deploy
on:
  push:
    paths:
      - ".github/workflows/netlify-deploy.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Prepare clean site bundle
        run: |
          mkdir -p dist/netlify/functions
          cp index.html manifest.webmanifest icon.svg icon-180.png icon-512.png netlify.toml package.json dist/
          cp netlify/functions/sync.js dist/netlify/functions/
          ls -la dist
      - name: Deploy to Netlify
        env:
          NETLIFY_PROXY_PATH: ${{ secrets.NETLIFY_PROXY_PATH }}
        run: |
          cd dist
          npx -y @netlify/mcp@latest --site-id 125d7b1c-bdbd-40b9-b917-d0169ba8370b --proxy-path "$NETLIFY_PROXY_PATH"
