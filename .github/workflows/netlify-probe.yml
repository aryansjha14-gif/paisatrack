name: netlify-probe
on:
  push:
    paths:
      - ".github/workflows/netlify-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Netlify reachability
        run: |
          for h in api.netlify.com netlify-mcp.netlify.app app.netlify.com; do
            printf '%-30s ' "$h"
            curl -sS -o /dev/null -w 'HTTP %{http_code}\n' --max-time 20 "https://$h/" || echo 'curl-failed'
          done
