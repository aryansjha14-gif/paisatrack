name: netlify-probe
on:
  push:
    paths:
      - ".github/workflows/netlify-probe.yml"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check live endpoints
        run: |
          for u in "https://paisatrack-app.netlify.app/" "https://paisatrack-app.netlify.app/manifest.webmanifest" "https://paisatrack-app.netlify.app/api/sync?key=0123456789abcdef"; do
            echo "--- $u"
            curl -sS -o /tmp/body -w 'HTTP %{http_code}\n' --max-time 25 "$u" || echo 'curl-failed'
            echo "body: $(head -c 300 /tmp/body)"
          done
