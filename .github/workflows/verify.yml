name: verify
on:
  push:
    paths:
      - ".github/workflows/verify.yml"
  workflow_dispatch:
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: Compare live builds
        run: |
          curl -sS --max-time 30 -o /tmp/n.html https://paisatrack-app.netlify.app/
          curl -sS --max-time 30 -o /tmp/g.html https://aryansjha14-gif.github.io/paisatrack/
          echo "netlify bytes=$(wc -c </tmp/n.html) ghpages bytes=$(wc -c </tmp/g.html)"
          echo "--- lines only in NETLIFY ---"
          diff /tmp/g.html /tmp/n.html | grep '^>' | head -20
      - name: Render live Netlify site in headless Chrome
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=7000 https://paisatrack-app.netlify.app/ > /tmp/dom.html 2>/dev/null || echo 'chrome exited nonzero'
          echo "dom bytes=$(wc -c </tmp/dom.html)"
          echo "title: $(grep -o '<title>[^<]*</title>' /tmp/dom.html | head -1)"
          echo "lang-current present: $(grep -c 'id=\"lang-current\"' /tmp/dom.html)"
          echo "category options rendered: $(grep -c 'Food and dining' /tmp/dom.html)"
          echo "stat value rendered: $(grep -c 's-balance' /tmp/dom.html)"
          echo "empty state rendered: $(grep -c 'No transactions yet' /tmp/dom.html)"
          echo "toast-action rendered: $(grep -c 'toast-action' /tmp/dom.html)"
