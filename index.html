<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PaisaTrack — Personal Finance &amp; Expense Tracker</title>
<meta name="description" content="A clean, private dashboard to track your daily income and expenses with charts. English and Hindi. Optional encrypted cross-device sync. All data stays in your browser." />
<meta name="theme-color" content="#6366f1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="PaisaTrack" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root{
    --bg:#f4f6fc; --card:#ffffff; --ink:#0f172a; --muted:#6b7488; --line:#e8ecf5;
    --accent:#6366f1; --accent2:#8b5cf6; --income:#10b981; --expense:#f43f5e;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px -14px rgba(16,24,40,.22);
    --shadow-hover:0 2px 4px rgba(16,24,40,.05), 0 18px 40px -18px rgba(16,24,40,.28);
    --radius:20px; --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 560px at 8% -12%, #e8ebff 0%, transparent 58%),
      radial-gradient(950px 520px at 102% -6%, #e6fbf4 0%, transparent 52%),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh; line-height:1.5;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 76px}

  header.top{
    position:sticky; top:0; z-index:20; margin:-22px -20px 20px; padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:rgba(244,246,252,.82); backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid rgba(232,236,245,.9);
  }
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
    box-shadow:0 12px 26px -10px rgba(99,102,241,.75); transition:transform .35s var(--ease)}
  .brand:hover .logo{transform:rotate(-4deg) scale(1.04)}
  .brand h1{margin:0;font-size:20.5px;letter-spacing:-.5px;font-weight:760}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,input,button{font-family:inherit;font-size:14px}
  .field{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;color:var(--ink);outline:none;transition:border-color .18s, box-shadow .18s, background .18s;max-width:100%}
  .field:hover{border-color:#d7ddea}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer;
    color:var(--ink);transition:transform .12s var(--ease), background .18s, border-color .18s, box-shadow .18s;font-weight:550}
  .btn:hover{background:#f8f9ff;border-color:#d7ddea;box-shadow:0 6px 16px -10px rgba(16,24,40,.4)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost-danger:hover{background:#fff1f3;border-color:#f7c8d2;color:#be123c}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
  .btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    box-shadow:0 10px 20px -12px rgba(99,102,241,.95)}
  .btn.primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .btn[disabled]{opacity:.55;cursor:not-allowed}

  .lang-wrap{position:relative;display:inline-block}
  .lang-btn{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14px;max-width:180px;
    transition:border-color .18s, box-shadow .18s, background .18s}
  .lang-btn:hover{border-color:#d7ddea;background:#f8f9ff}
  .lang-btn svg.globe{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
  .lang-btn svg.chev{width:14px;height:14px;color:var(--muted);flex:0 0 auto;transition:transform .2s}
  .lang-btn[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
  .lang-btn #lang-current{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lang-pop{position:absolute;top:calc(100% + 8px);right:0;width:300px;max-width:88vw;background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 22px 48px -18px rgba(16,24,40,.5);
    padding:10px;z-index:45;display:none}
  .lang-pop.open{display:block;animation:rise .22s var(--ease) both}
  .lang-search{display:flex;align-items:center;gap:8px;background:#f5f7fc;border:1px solid var(--line);
    border-radius:11px;padding:8px 10px}
  .lang-search svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
  .lang-search input{border:0;background:transparent;outline:none;width:100%;font-size:14px;color:var(--ink)}
  .lang-list{max-height:290px;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
  .lang-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:11px;cursor:pointer}
  .lang-item:hover,.lang-item.hl{background:#f2f4fd}
  .lang-item.cur{background:#eef0ff;box-shadow:inset 0 0 0 1px #ccd1f7}
  .lang-item .native{font-weight:600;font-size:14px}
  .lang-item .en{font-size:11.5px;color:var(--muted);flex:0 0 auto}
  .lang-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
  @media (max-width:560px){ .lang-pop{right:auto;left:0;width:270px} }

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;
    box-shadow:var(--shadow);transition:transform .3s var(--ease), box-shadow .3s var(--ease)}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .stat .label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .stat .value{font-size:26px;font-weight:760;letter-spacing:-.8px;margin-top:10px;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .stat.balance .value{color:var(--accent)}
  .stat.income .value{color:var(--income)}
  .stat.expense .value{color:var(--expense)}

  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
    transition:box-shadow .3s var(--ease)}
  .panel:hover{box-shadow:var(--shadow-hover)}
  .panel h2{margin:0 0 4px;font-size:15.5px;letter-spacing:-.2px;font-weight:700}
  .panel .hint{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
  .col{display:flex;flex-direction:column;gap:18px}

  .bars{width:100%;height:230px;display:block}
  .bars rect.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s var(--ease) both}
  @keyframes grow{from{transform:scaleY(.001)}to{transform:scaleY(1)}}
  .legend{display:flex;gap:16px;margin-top:6px;font-size:12.5px;color:var(--muted);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:7px}

  .donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .donut{flex:0 0 auto;animation:spinIn .7s var(--ease) both}
  @keyframes spinIn{from{opacity:0;transform:rotate(-14deg) scale(.9)}to{opacity:1;transform:none}}
  .donut circle.seg{transition:opacity .2s}
  .donut:hover circle.seg{opacity:.72}
  .donut circle.seg:hover{opacity:1}
  .donut-center{font-size:11px;fill:var(--muted)}
  .donut-center-amt{font-size:17px;font-weight:760;fill:var(--ink)}
  .cat-list{flex:1 1 200px;display:flex;flex-direction:column;gap:11px;min-width:180px}
  .cat-row{display:flex;align-items:center;gap:10px;font-size:13px;animation:rise .45s var(--ease) both}
  .cat-row .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .cat-row .name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-row .amt{font-weight:660;font-variant-numeric:tabular-nums}
  .cat-row .pct{color:var(--muted);width:38px;text-align:right;font-size:12px}
  .empty{color:var(--muted);font-size:13px;padding:24px 4px;text-align:center;line-height:1.8}
  .empty .big{display:block;font-size:26px;margin-bottom:8px;opacity:.75}

  .seg{display:flex;background:#f1f3fb;border-radius:14px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;cursor:pointer;color:var(--muted);
    font-weight:680;transition:background .22s var(--ease), color .22s, box-shadow .22s}
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(16,24,40,.18)}
  .seg button.active[data-type="expense"]{color:var(--expense)}
  .seg button.active[data-type="income"]{color:var(--income)}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .form-row label{font-size:12.5px;color:var(--muted);font-weight:650}
  .form-row .field{width:100%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .reveal{overflow:hidden;max-height:0;opacity:0;transition:max-height .32s var(--ease), opacity .28s var(--ease), margin .28s var(--ease)}
  .reveal.open{max-height:260px;opacity:1}
  .submit{width:100%;border:0;border-radius:13px;padding:12px;font-weight:720;color:#fff;cursor:pointer;font-size:14.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 12px 24px -12px rgba(99,102,241,.95);transition:transform .12s var(--ease), filter .18s, box-shadow .25s}
  .submit:hover{filter:brightness(1.06);box-shadow:0 16px 30px -12px rgba(99,102,241,1)}
  .submit:active{transform:translateY(1px) scale(.995)}
  .form-actions{display:flex;gap:10px;flex-wrap:wrap}
  .form-actions .submit{flex:1}
  .form-actions .btn{flex:0 0 auto}

  .tx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .tx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tx-list{display:flex;flex-direction:column;gap:2px;max-height:430px;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;cursor:pointer;
    transition:background .18s, transform .18s var(--ease);animation:rise .35s var(--ease) both}
  .tx:hover{background:#f7f8ff;transform:translateX(2px)}
  .tx.editing{background:#eef0ff;box-shadow:inset 0 0 0 1px #c9cdf7}
  .tx .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
  .tx .mid{flex:1 1 auto;min-width:0}
  .tx .cat{font-size:13.5px;font-weight:660;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .meta{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .amt{font-weight:720;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
  .tx .amt.in{color:var(--income)}
  .tx .amt.out{color:var(--expense)}
  .tx .del{border:0;background:transparent;color:#b9c0cf;cursor:pointer;font-size:15px;padding:7px 9px;border-radius:9px;
    opacity:.65;transition:.18s;line-height:1;flex:0 0 auto}
  .tx:hover .del{opacity:1;background:#fff1f3;color:#e11d48}
  .toast{display:flex;align-items:center;justify-content:center}
  .toast.show{pointer-events:auto}
  .toast-btn{border:0;background:rgba(255,255,255,.18);color:#fff;font-weight:700;border-radius:9px;
    padding:6px 12px;margin-left:12px;cursor:pointer;font-size:13px}
  .toast-btn:hover{background:rgba(255,255,255,.3)}
  .tx .del:hover{background:#fff1f3;color:#e11d48}

  /* ---------- data / backup / sync panel ---------- */
  .wide{grid-column:1 / -1;margin-top:18px}
  .data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .dcard{background:#f8f9ff;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;flex-direction:column;gap:8px;
    transition:transform .25s var(--ease), box-shadow .25s var(--ease)}
  .dcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(16,24,40,.5)}
  .dcard .dt{font-size:12.5px;font-weight:720;display:flex;align-items:center;gap:8px;color:var(--ink)}
  .dcard .dt svg{width:15px;height:15px;flex:0 0 auto;color:var(--accent)}
  .dcard .db{font-size:12.5px;color:var(--muted);flex:1 1 auto;line-height:1.65}
  .dcard .da{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:680;padding:3px 9px;border-radius:999px}
  .pill.ok{background:#e7f8f1;color:#047857}
  .pill.warn{background:#fff5e6;color:#b45309}
  .pill.off{background:#eef1f7;color:#64748b}
  .explain{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .explain summary{cursor:pointer;font-size:13px;font-weight:680;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  .explain summary::-webkit-details-marker{display:none}
  .explain summary::before{content:"▸";transition:transform .2s var(--ease);color:var(--muted)}
  .explain[open] summary::before{transform:rotate(90deg)}
  .explain .body{margin-top:12px;font-size:12.8px;color:var(--muted);line-height:1.85}
  .explain .body b{color:var(--ink)}
  .explain .body ul{margin:8px 0 0;padding-left:18px}
  .explain .body li{margin:3px 0}
  .syncbox{margin-top:14px;background:#f8f9ff;border:1px solid var(--line);border-radius:15px;padding:16px}
  .syncbox .two{margin-bottom:0}
  .warnbar{display:none;align-items:center;gap:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    border-radius:14px;padding:11px 14px;font-size:12.8px;margin-bottom:16px}
  .warnbar.show{display:flex}

  footer{margin-top:32px;text-align:center;color:var(--muted);font-size:12px;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px) scale(.98);background:#0f172a;color:#fff;
    padding:11px 18px;border-radius:13px;font-size:13.5px;opacity:0;pointer-events:none;z-index:60;
    transition:opacity .28s var(--ease), transform .28s var(--ease);box-shadow:0 18px 40px -14px rgba(0,0,0,.6);max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .stat,.panel{animation:rise .55s var(--ease) both}
  .stats .stat:nth-child(1){animation-delay:.03s}
  .stats .stat:nth-child(2){animation-delay:.08s}
  .stats .stat:nth-child(3){animation-delay:.13s}
  .stats .stat:nth-child(4){animation-delay:.18s}

  @media (max-width:980px){ .grid{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} .data-grid{grid-template-columns:1fr} }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr 1fr} .stat .value{font-size:21px} .wrap{padding:18px 14px 64px}
    header.top{margin:-18px -14px 16px;padding:13px 14px}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 44 44" width="46" height="46">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
          </linearGradient></defs>
          <rect width="44" height="44" rx="13" fill="url(#lg)"/>
          <path d="M13 29.5 L19 23 L23.5 27 L31 16.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="31" cy="16.5" r="2.8" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>PaisaTrack</h1>
        <p data-i18n="tagline">Personal finance &amp; expense tracker</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="lang-wrap">
        <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" title="Language / भाषा">
          <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>
          <span id="lang-current">English</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="lang-pop" id="lang-pop">
          <div class="lang-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="lang-search" type="text" autocomplete="off" placeholder="Search language" aria-label="Search language" />
          </div>
          <div class="lang-list" id="lang-list" role="listbox" aria-label="Languages"></div>
        </div>
      </div>
      <select id="period" class="field" aria-label="Period">
        <option value="month" data-i18n="thisMonth"></option>
        <option value="30" data-i18n="last30"></option>
        <option value="year" data-i18n="thisYear"></option>
        <option value="all" selected data-i18n="allTime"></option>
      </select>
      <button id="sample" class="btn" data-i18n="loadSample"></button>
      <button id="reset" class="btn ghost-danger" data-i18n="clearAll"></button>
    </div>
  </header>

  <div class="warnbar" id="private-warn"><span>⚠️</span><span data-i18n="privateWarn"></span></div>

  <section class="stats">
    <div class="stat balance">
      <div class="label"><span class="dot" style="background:var(--accent)"></span><span data-i18n="balance"></span></div>
      <div class="value" id="s-balance">₹0</div>
      <div class="sub" id="s-balance-sub"></div>
    </div>
    <div class="stat income">
      <div class="label"><span class="dot" style="background:var(--income)"></span><span data-i18n="income"></span></div>
      <div class="value" id="s-income">₹0</div>
      <div class="sub" id="s-income-sub"></div>
    </div>
    <div class="stat expense">
      <div class="label"><span class="dot" style="background:var(--expense)"></span><span data-i18n="expenses"></span></div>
      <div class="value" id="s-expense">₹0</div>
      <div class="sub" id="s-expense-sub"></div>
    </div>
    <div class="stat">
      <div class="label"><span class="dot" style="background:#f59e0b"></span><span data-i18n="savingsRate"></span></div>
      <div class="value" id="s-save">0%</div>
      <div class="sub" data-i18n="ofIncomeKept"></div>
    </div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="panel">
        <h2 data-i18n="cashFlow"></h2>
        <p class="hint" data-i18n="cashFlowHint"></p>
        <svg id="bars" class="bars" viewBox="0 0 640 230" preserveAspectRatio="none" role="img" aria-label="Monthly income and expense bar chart"></svg>
        <div class="legend">
          <span><span class="dot" style="background:var(--income)"></span><span data-i18n="income"></span></span>
          <span><span class="dot" style="background:var(--expense)"></span><span data-i18n="expenses"></span></span>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="whereMoney"></h2>
        <p class="hint" data-i18n="expenseBreakdown"></p>
        <div class="donut-wrap">
          <svg id="donut" class="donut" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Expense breakdown by category"></svg>
          <div class="cat-list" id="cat-list"></div>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2 id="form-title" data-i18n="addTransaction"></h2>
        <p class="hint" data-i18n="savedInBrowser"></p>
        <form id="form" novalidate>

  function download(filename, text, mime){

  /* ============================ storage ============================ */
  function normalize(t){
    if(!t || typeof t!=="object") return null;
    var type = t.type==="income" ? "income" : "expense";
    var amount = Number(t.amount);
    if(!isFinite(amount) || amount<=0) return null;
    var category = t.category || (type==="income"?"other_income":"other");
    if(!catDef(type, category)) category = type==="income"?"other_income":"other";
    var date = (typeof t.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(t.date)) ? t.date : iso(new Date());
    return { id: t.id||uid(), type:type, amount:amount, category:category,
             custom: typeof t.custom==="string" ? t.custom.slice(0,30) : "",
             date:date, note:String(t.note||"").slice(0,60) };
  }
  function pruneTomb(){
    var now = Date.now(), k;
    for(k in state.tomb){ if(!state.tomb[k] || (now - state.tomb[k]) > TOMB_TTL) delete state.tomb[k]; }
  }
  function save(){
    try{
      pruneTomb();
      localStorage.setItem(LS_KEY, JSON.stringify({version:4, lang:lang, tx:state.tx, tomb:state.tomb}));
      localStorage.setItem(LS_META, JSON.stringify({lastBackup:meta.lastBackup, sync:sync}));
    }catch(e){}
  }
  function load(){
    var raw=null, i;
    try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
    if(!raw){ for(i=0;i<LS_OLD.length && !raw;i++){ try{ raw = localStorage.getItem(LS_OLD[i]); }catch(e){} } }
    if(raw){
      try{
        var d = JSON.parse(raw);
        if(d && Array.isArray(d.tx)) state.tx = d.tx.map(normalize).filter(Boolean);
        if(d && d.tomb && typeof d.tomb==="object") state.tomb = d.tomb;
        if(d && d.lang && I18N[d.lang]) lang = d.lang;
      }catch(e){ state.tx = []; }
    }
    try{
      var m = JSON.parse(localStorage.getItem(LS_META) || "null");
      if(m){ meta.lastBackup = m.lastBackup || 0; if(m.sync) sync = { on:!!m.sync.on, email:m.sync.email||"", last:m.sync.last||0 }; }
    }catch(e){}
  }

  /* ============================ period ============================ */
  function periodStart(){
    var v = document.getElementById("period").value;
    var now = new Date(); now.setHours(0,0,0,0);
    if(v==="month") return new Date(now.getFullYear(), now.getMonth(), 1);
    if(v==="30"){ var d = new Date(now); d.setDate(d.getDate()-29); return d; }
    if(v==="year") return new Date(now.getFullYear(), 0, 1);
    return null;
  }
  function inPeriod(s){
    var p = periodStart(); if(!p) return true;
    var d = new Date(s+"T00:00:00");
    return !isNaN(d.getTime()) && d>=p;
  }

  function renderBars(){
    var svg = document.getElementById("bars");
    var W=640, H=230, padL=74, padR=12, padT=14, padB=34;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var now=new Date(), months=[], i;
    for(i=5;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label:monthShort(d), income:0, expense:0 });
    }
    var idx={}; months.forEach(function(m,j){ idx[m.key]=j; });
    state.tx.forEach(function(t){
      var k=(t.date||"").slice(0,7);
      if(idx[k]===undefined) return;
      months[idx[k]][t.type==="income"?"income":"expense"] += t.amount;
    });
    var max=0; months.forEach(function(m){ max=Math.max(max,m.income,m.expense); });
    var top=1;
    if(max>0){ var step=Math.pow(10, Math.floor(Math.log(max)/Math.LN10))/2; top=Math.ceil(max/step)*step; }

    var parts=[], ticks=4, g;
    for(g=0;g<=ticks;g++){
      var y = padT+plotH-(plotH*g/ticks);
      parts.push('<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef1f7" stroke-width="1"/>');
      parts.push('<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="#9aa3b6">'+esc(short(top*g/ticks))+'</text>');
    }
    var groupW=plotW/months.length, barW=Math.min(20, groupW*0.28), gap=5;
    months.forEach(function(m,j){
      var cx=padL+groupW*j+groupW/2, xI=cx-barW-gap/2, xE=cx+gap/2;
      var hI=(m.income/top)*plotH, hE=(m.expense/top)*plotH, baseY=padT+plotH, dly=(j*0.05).toFixed(2);
      parts.push('<rect class="bar" style="animation-delay:'+dly+'s" x="'+xI.toFixed(1)+'" y="'+(baseY-hI).toFixed(1)+'" width="'+barW+'" height="'+Math.max(hI,0).toFixed(1)+'" rx="4" fill="var(--income)"><title>'+esc(m.label)+" "+esc(T("income"))+': '+money(m.income)+'</title></rect>');
      parts.push('<rect class="bar" style="animation-delay:'+dly+'s" x="'+xE.toFixed(1)+'" y="'+(baseY-hE).toFixed(1)+'" width="'+barW+'" height="'+Math.max(hE,0).toFixed(1)+'" rx="4" fill="var(--expense)"><title>'+esc(m.label)+" "+esc(T("expenses"))+': '+money(m.expense)+'</title></rect>');
      parts.push('<text x="'+cx.toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" font-size="11.5" fill="#6b7488">'+esc(m.label)+'</text>');
    });
    svg.innerHTML = parts.join("");
  }

  async function initStorage(){
    try{
      if(navigator.storage && navigator.storage.persisted){
        var p = await navigator.storage.persisted();
        if(!p && navigator.storage.persist){ try{ p = await navigator.storage.persist(); }catch(e){} }
        storageInfo.persistent = !!p;
      }
    }catch(e){}
    try{
      if(navigator.storage && navigator.storage.estimate){
        var est = await navigator.storage.estimate();
        storageInfo.usage = est.usage; storageInfo.quota = est.quota;
        if(est.quota && est.quota < 200*1024*1024) storageInfo.private = true;
      }
    }catch(e){}
    if(storageInfo.private) document.getElementById("private-warn").classList.add("show");
    renderData();
  }

  /* ============================ sync ============================ */
  function bufToHex(buf){
    var b = new Uint8Array(buf), out = "";
    for(var i=0;i<b.length;i++) out += ("0"+b[i].toString(16)).slice(-2);
    return out;
  }
  function hexToBytes(hex){
    var out = new Uint8Array(hex.length/2);
    for(var i=0;i<out.length;i++) out[i] = parseInt(hex.substr(i*2,2), 16);
    return out;
  }
  function syncSupported(){
    return typeof crypto !== "undefined" && crypto.subtle && typeof TextEncoder !== "undefined";
  }
  async function deriveKeys(email, secret){
    var enc = new TextEncoder();
    var idHash = await crypto.subtle.digest("SHA-256", enc.encode("paisatrack-id|" + email.toLowerCase().trim() + "|" + secret));
    var id = bufToHex(idHash);
    var baseKey = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: enc.encode("paisatrack-salt|" + email.toLowerCase().trim()), iterations: 120000, hash:"SHA-256" },
      baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
    return { id:id, key:key };
  }
  async function encryptPayload(key, obj){
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { iv: bufToHex(iv), data: bufToHex(ct) };
  }
  async function decryptPayload(key, payload){
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv: hexToBytes(payload.iv) }, key, hexToBytes(payload.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function mergeRemote(remote){
    if(!remote || typeof remote !== "object") return;
    var byId = {}, i;
    state.tx.forEach(function(t){ byId[t.id] = t; });
    (remote.tx||[]).forEach(function(t){ var n = normalize(t); if(n && !byId[n.id]) byId[n.id] = n; });
    var tomb = {};
    for(i in state.tomb) tomb[i] = state.tomb[i];
    for(i in (remote.tomb||{})) tomb[i] = Math.max(tomb[i]||0, remote.tomb[i]||0);
    var out = [];
    for(i in byId){ if(!tomb[i]) out.push(byId[i]); }
    state.tx = out; state.tomb = tomb;
  }
  function setSyncMsg(msg, kind){
    var el = document.getElementById("sync-msg");
    el.textContent = msg || "";
    el.style.color = kind==="err" ? "#be123c" : (kind==="ok" ? "#047857" : "");
  }
  async function fetchWithRetry(url, opts, tries){
    tries = tries || 3;
    var last = null, r = null, i;
    for(i = 0; i < tries; i++){
      try{
        r = await fetch(url, opts);
        if(r.status !== 403 && r.status !== 408 && r.status !== 429 && r.status < 500) return r;
        last = new Error("HTTP " + r.status);
      }catch(e){ last = e; r = null; }
      await new Promise(function(res){ setTimeout(res, 500 * (i + 1)); });
    }
    if(r) return r;
    throw (last || new Error("network error"));
  }
  async function doSync(){
    if(!syncSupported()){ setSyncMsg(T("syncUnsupported"), "err"); return; }
    var email = document.getElementById("sync-email").value.trim();
    var secret = document.getElementById("sync-secret").value;
    if(!email || !secret){ setSyncMsg(T("syncNeed"), "err"); return; }
    setSyncMsg(T("syncBusy"));
    var btn = document.getElementById("sync-now");
    btn.disabled = true;
    try{
      var keys = await deriveKeys(email, secret);
      var res = await fetchWithRetry(SYNC_ENDPOINT + "?key=" + encodeURIComponent(keys.id), { method:"GET", headers:{ "accept":"application/json" } });
      if(res.status === 404){ /* nothing remote yet */ }
      else if(res.ok){
        var body = await res.json();
        if(body && body.payload){
          var remote = await decryptPayload(keys.key, body.payload);
          mergeRemote(remote);
        }
      }else{
        throw new Error("pull " + res.status);
      }
      var payload = await encryptPayload(keys.key, { tx:state.tx, tomb:state.tomb, updatedAt:Date.now() });
      var put = await fetchWithRetry(SYNC_ENDPOINT, {
        method:"POST", headers:{ "content-type":"application/json" },
        body: JSON.stringify({ key: keys.id, payload: payload })
      });
      if(!put.ok) throw new Error("push " + put.status);
      sync.on = true; sync.email = email; sync.last = Date.now();
      save(); resetForm(); render(); renderData();
      setSyncMsg(T("syncDone"), "ok");
      toast(T("syncDone"));
    }catch(e){
      setSyncMsg(T("syncErr") + (e && e.message ? " ("+e.message+")" : ""), "err");
    }finally{
      btn.disabled = false;
    }
  }

  /* ============================ events ============================ */
  function bind(){
    var langBtn = document.getElementById("lang-btn");
    var langPop = document.getElementById("lang-pop");
    var langSearch = document.getElementById("lang-search");
    var langList = document.getElementById("lang-list");
    langBtn.addEventListener("click", function(e){ e.stopPropagation(); openLangPop(!langPop.classList.contains("open")); });
    langPop.addEventListener("click", function(e){ e.stopPropagation(); });
    langSearch.addEventListener("input", renderLangList);
    langSearch.addEventListener("keydown", function(e){
      if(e.key === "Escape"){ openLangPop(false); langBtn.focus(); }
      else if(e.key === "Enter"){ var f = langList.querySelector(".lang-item"); if(f) chooseLang(f.getAttribute("data-code")); }
    });
    langList.addEventListener("click", function(e){
      var it = e.target.closest(".lang-item"); if(it) chooseLang(it.getAttribute("data-code"));
    });
    document.addEventListener("click", function(){ if(langPop.classList.contains("open")) openLangPop(false); });
    document.addEventListener("keydown", function(e){ if(e.key === "Escape" && langPop.classList.contains("open")) openLangPop(false); });
    document.getElementById("seg").addEventListener("click", function(e){
      var b = e.target.closest("button[data-type]"); if(b) setType(b.getAttribute("data-type"));
    });
    document.getElementById("category").addEventListener("change", syncCustomVisibility);
    document.getElementById("period").addEventListener("change", render);

    document.getElementById("form").addEventListener("submit", function(e){
      e.preventDefault();
      var amt = parseFloat(document.getElementById("amount").value);
      var date = document.getElementById("date").value;
      if(!(amt>0)){ document.getElementById("amount").focus(); return; }
      if(!date){ document.getElementById("date").focus(); return; }
      var cat = document.getElementById("category").value;
      var custom = OTHER_KEYS[cat] ? document.getElementById("custom").value.trim().slice(0,30) : "";
      var payload = { type:formType, amount:amt, category:cat, custom:custom, date:date, note:document.getElementById("note").value.trim() };
      if(editingId){
        for(var i=0;i<state.tx.length;i++){
          if(state.tx[i].id===editingId){
            state.tx[i].type=payload.type; state.tx[i].amount=payload.amount; state.tx[i].category=payload.category;
            state.tx[i].custom=payload.custom; state.tx[i].date=payload.date; state.tx[i].note=payload.note;
          }
        }
        save(); resetForm(); render(); toast(T("updated"));
      }else{
        payload.id = uid(); state.tx.push(payload); save();
        document.getElementById("form").reset();
        document.getElementById("date").value = iso(new Date());
        setType(formType); render();
        document.getElementById("amount").focus(); toast(T("added"));
      }
    });
    document.getElementById("cancel-btn").addEventListener("click", function(){ resetForm(); });

    document.getElementById("tx-list").addEventListener("click", function(e){
      var del = e.target.closest("button[data-del]");
      if(del){
        e.stopPropagation();
        var did = del.getAttribute("data-del");
        var removed = null, ri;
        for(ri=0; ri<state.tx.length; ri++){ if(state.tx[ri].id===did){ removed = state.tx[ri]; break; } }
        state.tx = state.tx.filter(function(t){ return t.id!==did; });
        state.tomb[did] = Date.now();
        if(editingId===did) resetForm();
        save(); render();
        toast(T("deleted"), T("undo"), function(){
          if(removed){ delete state.tomb[did]; state.tx.push(removed); save(); render(); }
        });
        return;
      }
      var row = e.target.closest(".tx[data-id]");
      if(row) startEdit(row.getAttribute("data-id"));
    });

    document.getElementById("reset").addEventListener("click", function(){
      if(!state.tx.length) return;
      if(window.confirm(T("confirmClear"))){
        var now = Date.now();
        state.tx.forEach(function(t){ state.tomb[t.id] = now; });
        state.tx = []; save(); resetForm(); render();
      }
    });
    document.getElementById("sample").addEventListener("click", function(){
      if(state.tx.length && !window.confirm(T("confirmSample"))) return;
      state.tx = sampleData(); state.tomb = {}; save(); resetForm(); render();
    });

    document.getElementById("csv-btn").addEventListener("click", exportCsv);
    document.getElementById("backup-btn").addEventListener("click", exportJson);
    document.getElementById("backup2").addEventListener("click", exportJson);
    function openRestore(){ document.getElementById("restore-file").click(); }
    document.getElementById("restore-btn").addEventListener("click", openRestore);
    document.getElementById("restore2").addEventListener("click", openRestore);
    document.getElementById("restore-file").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(f) importJson(f);
      e.target.value = "";
    });

    var syncForm = document.getElementById("sync-form");
    document.getElementById("sync-toggle").addEventListener("click", function(){
      if(sync.on){ doSync(); return; }
      syncForm.classList.toggle("open");
      if(syncForm.classList.contains("open")) document.getElementById("sync-email").focus();
    });
    document.getElementById("sync-now").addEventListener("click", doSync);
    document.getElementById("sync-off").addEventListener("click", function(){
      sync = { on:false, email:"", last:0 };
      document.getElementById("sync-secret").value = "";
      save(); renderData(); syncForm.classList.remove("open");
      setSyncMsg("");
      toast(T("syncDisabled"));
    });
  }

  /* ============================ init ============================ */
  function init(){
    load();
    try{
      var q = new URLSearchParams(window.location.search).get("lang");
      if(q && I18N[q]) lang = q;
    }catch(e){}
    bind();
    updateLangButton();
    applyI18n();
    setType("expense");
    document.getElementById("date").value = iso(new Date());
    if(sync.on){
      document.getElementById("sync-email").value = sync.email;
      document.getElementById("sync-form").classList.add("open");
    }
    render(); renderData();
    initStorage();
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
