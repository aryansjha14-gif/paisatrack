<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PaisaTrack — Personal Finance &amp; Expense Tracker</title>
<meta name="description" content="A clean, private dashboard to track your daily income and expenses with charts. Works in English and Hindi. All data stays in your browser." />
<meta name="theme-color" content="#6366f1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='44' height='44' rx='13' fill='url(%23g)'/%3E%3Cpath d='M13 29.5 L19 23 L23.5 27 L31 16.5' fill='none' stroke='%23fff' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='31' cy='16.5' r='2.8' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f4f6fc; --card:#ffffff; --ink:#0f172a; --muted:#6b7488; --line:#e8ecf5;
    --accent:#6366f1; --accent2:#8b5cf6; --income:#10b981; --expense:#f43f5e;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px -14px rgba(16,24,40,.22);
    --shadow-hover:0 2px 4px rgba(16,24,40,.05), 0 18px 40px -18px rgba(16,24,40,.28);
    --radius:20px;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Helvetica Neue",Arial,sans-serif;
    background:
      radial-gradient(1100px 560px at 8% -12%, #e8ebff 0%, transparent 58%),
      radial-gradient(950px 520px at 102% -6%, #e6fbf4 0%, transparent 52%),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased; min-height:100vh;
    line-height:1.5;
  }
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 76px}

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:0; z-index:20; margin:-22px -20px 20px; padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:rgba(244,246,252,.82); backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid rgba(232,236,245,.9);
  }
  .brand{display:flex;align-items:center;gap:13px}
  .logo{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
    box-shadow:0 12px 26px -10px rgba(99,102,241,.75); transition:transform .35s var(--ease)}
  .brand:hover .logo{transform:rotate(-4deg) scale(1.04)}
  .brand h1{margin:0;font-size:20.5px;letter-spacing:-.5px;font-weight:760}
  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,input,button{font-family:inherit;font-size:14px}
  .field{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;color:var(--ink);outline:none;transition:border-color .18s, box-shadow .18s, background .18s;max-width:100%}
  .field:hover{border-color:#d7ddea}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,102,241,.15)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer;
    color:var(--ink);transition:transform .12s var(--ease), background .18s, border-color .18s, box-shadow .18s;font-weight:550}
  .btn:hover{background:#f8f9ff;border-color:#d7ddea;box-shadow:0 6px 16px -10px rgba(16,24,40,.4)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost-danger:hover{background:#fff1f3;border-color:#f7c8d2;color:#be123c}
  .btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}

  .lang-wrap{position:relative;display:inline-flex;align-items:center}
  .lang-wrap svg.globe{position:absolute;left:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}
  .lang-wrap svg.chev{position:absolute;right:9px;width:14px;height:14px;color:var(--muted);pointer-events:none}
  #lang{appearance:none;padding:9px 30px 9px 33px;cursor:pointer;font-weight:600}

  /* ---------- stat cards ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;
    box-shadow:var(--shadow);transition:transform .3s var(--ease), box-shadow .3s var(--ease)}
  .stat:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
  .stat .label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:650;letter-spacing:.2px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .stat .value{font-size:26px;font-weight:760;letter-spacing:-.8px;margin-top:10px;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:5px}
  .stat.balance .value{color:var(--accent)}
  .stat.income .value{color:var(--income)}
  .stat.expense .value{color:var(--expense)}

  /* ---------- layout ---------- */
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
    transition:box-shadow .3s var(--ease)}
  .panel:hover{box-shadow:var(--shadow-hover)}
  .panel h2{margin:0 0 4px;font-size:15.5px;letter-spacing:-.2px;font-weight:700}
  .panel .hint{margin:0 0 16px;font-size:12.5px;color:var(--muted)}
  .col{display:flex;flex-direction:column;gap:18px}

  /* ---------- charts ---------- */
  .bars{width:100%;height:230px;display:block}
  .bars rect.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s var(--ease) both}
  @keyframes grow{from{transform:scaleY(.001)}to{transform:scaleY(1)}}
  .legend{display:flex;gap:16px;margin-top:6px;font-size:12.5px;color:var(--muted);align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:7px}

  .donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .donut{flex:0 0 auto;animation:spinIn .7s var(--ease) both}
  @keyframes spinIn{from{opacity:0;transform:rotate(-14deg) scale(.9)}to{opacity:1;transform:none}}
  .donut circle.seg{transition:opacity .2s}
  .donut:hover circle.seg{opacity:.72}
  .donut circle.seg:hover{opacity:1}
  .donut-center{font-size:11px;fill:var(--muted)}
  .donut-center-amt{font-size:17px;font-weight:760;fill:var(--ink)}
  .cat-list{flex:1 1 200px;display:flex;flex-direction:column;gap:11px;min-width:180px}
  .cat-row{display:flex;align-items:center;gap:10px;font-size:13px;animation:rise .45s var(--ease) both}
  .cat-row .swatch{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .cat-row .name{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-row .amt{font-weight:660;font-variant-numeric:tabular-nums}
  .cat-row .pct{color:var(--muted);width:38px;text-align:right;font-size:12px}
  .empty{color:var(--muted);font-size:13px;padding:24px 4px;text-align:center;line-height:1.8}
  .empty .big{display:block;font-size:26px;margin-bottom:8px;opacity:.75}

  /* ---------- form ---------- */
  .seg{display:flex;background:#f1f3fb;border-radius:14px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;cursor:pointer;color:var(--muted);
    font-weight:680;transition:background .22s var(--ease), color .22s, box-shadow .22s}
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px -2px rgba(16,24,40,.18)}
  .seg button.active[data-type="expense"]{color:var(--expense)}
  .seg button.active[data-type="income"]{color:var(--income)}
  .form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .form-row label{font-size:12.5px;color:var(--muted);font-weight:650}
  .form-row .field{width:100%}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .reveal{overflow:hidden;max-height:0;opacity:0;transition:max-height .32s var(--ease), opacity .28s var(--ease), margin .28s var(--ease)}
  .reveal.open{max-height:120px;opacity:1}
  .submit{width:100%;border:0;border-radius:13px;padding:12px;font-weight:720;color:#fff;cursor:pointer;font-size:14.5px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 12px 24px -12px rgba(99,102,241,.95);transition:transform .12s var(--ease), filter .18s, box-shadow .25s}
  .submit:hover{filter:brightness(1.06);box-shadow:0 16px 30px -12px rgba(99,102,241,1)}
  .submit:active{transform:translateY(1px) scale(.995)}
  .form-actions{display:flex;gap:10px}
  .form-actions .submit{flex:1}
  .form-actions .btn{flex:0 0 auto}

  /* ---------- transactions ---------- */
  .tx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .tx-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tx-list{display:flex;flex-direction:column;gap:2px;max-height:430px;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
  .tx{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;cursor:pointer;
    transition:background .18s, transform .18s var(--ease);animation:rise .35s var(--ease) both}
  .tx:hover{background:#f7f8ff;transform:translateX(2px)}
  .tx.editing{background:#eef0ff;box-shadow:inset 0 0 0 1px #c9cdf7}
  .tx .icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
  .tx .mid{flex:1 1 auto;min-width:0}
  .tx .cat{font-size:13.5px;font-weight:660;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .meta{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tx .amt{font-weight:720;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
  .tx .amt.in{color:var(--income)}
  .tx .amt.out{color:var(--expense)}
  .tx .del{border:0;background:transparent;color:#c3c9d6;cursor:pointer;font-size:15px;padding:5px 7px;border-radius:9px;
    opacity:0;transition:.18s;line-height:1}
  .tx:hover .del{opacity:1}
  .tx .del:hover{background:#fff1f3;color:#e11d48}

  footer{margin-top:32px;text-align:center;color:var(--muted);font-size:12px;line-height:1.9}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px) scale(.98);background:#0f172a;color:#fff;
    padding:11px 18px;border-radius:13px;font-size:13.5px;opacity:0;pointer-events:none;z-index:60;
    transition:opacity .28s var(--ease), transform .28s var(--ease);box-shadow:0 18px 40px -14px rgba(0,0,0,.6)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .stat,.panel{animation:rise .55s var(--ease) both}
  .stats .stat:nth-child(1){animation-delay:.03s}
  .stats .stat:nth-child(2){animation-delay:.08s}
  .stats .stat:nth-child(3){animation-delay:.13s}
  .stats .stat:nth-child(4){animation-delay:.18s}

  @media (max-width:980px){ .grid{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){
    .stats{grid-template-columns:1fr 1fr} .stat .value{font-size:21px} .wrap{padding:18px 14px 64px}
    header.top{margin:-18px -14px 16px;padding:13px 14px}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 44 44" width="46" height="46">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <rect width="44" height="44" rx="13" fill="url(#lg)"/>
          <path d="M13 29.5 L19 23 L23.5 27 L31 16.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="31" cy="16.5" r="2.8" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>PaisaTrack</h1>
        <p data-i18n="tagline">Personal finance &amp; expense tracker</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="lang-wrap" title="Language / भाषा">
        <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 2.6 15.3 0 18M12 3c-2.6 2.7-2.6 15.3 0 18"/></svg>
        <select id="lang" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
        </select>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </label>
      <select id="period" class="field" aria-label="Period">
        <option value="month" data-i18n="thisMonth"></option>
        <option value="30" data-i18n="last30"></option>
        <option value="year" data-i18n="thisYear"></option>
        <option value="all" selected data-i18n="allTime"></option>
      </select>
      <button id="sample" class="btn" data-i18n="loadSample"></button>
      <button id="reset" class="btn ghost-danger" data-i18n="clearAll"></button>
    </div>
  </header>

  <section class="stats">
    <div class="stat balance">
      <div class="label"><span class="dot" style="background:var(--accent)"></span><span data-i18n="balance"></span></div>
      <div class="value" id="s-balance">₹0</div>
      <div class="sub" id="s-balance-sub"></div>
    </div>
    <div class="stat income">
      <div class="label"><span class="dot" style="background:var(--income)"></span><span data-i18n="income"></span></div>
      <div class="value" id="s-income">₹0</div>
      <div class="sub" id="s-income-sub"></div>
    </div>
    <div class="stat expense">
      <div class="label"><span class="dot" style="background:var(--expense)"></span><span data-i18n="expenses"></span></div>
      <div class="value" id="s-expense">₹0</div>
      <div class="sub" id="s-expense-sub"></div>
    </div>
    <div class="stat">
      <div class="label"><span class="dot" style="background:#f59e0b"></span><span data-i18n="savingsRate"></span></div>
      <div class="value" id="s-save">0%</div>
      <div class="sub" data-i18n="ofIncomeKept"></div>
    </div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="panel">
        <h2 data-i18n="cashFlow"></h2>
        <p class="hint" data-i18n="cashFlowHint"></p>
        <svg id="bars" class="bars" viewBox="0 0 640 230" preserveAspectRatio="none" role="img" aria-label="Monthly income and expense bar chart"></svg>
        <div class="legend">
          <span><span class="dot" style="background:var(--income)"></span><span data-i18n="income"></span></span>
          <span><span class="dot" style="background:var(--expense)"></span><span data-i18n="expenses"></span></span>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="whereMoney"></h2>
        <p class="hint" data-i18n="expenseBreakdown"></p>
        <div class="donut-wrap">
          <svg id="donut" class="donut" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Expense breakdown by category"></svg>
          <div class="cat-list" id="cat-list"></div>
        </div>
      </section>
    </div>

    <div class="col">
      <section class="panel">
        <h2 id="form-title" data-i18n="addTransaction"></h2>
        <p class="hint" data-i18n="savedInBrowser"></p>
        <form id="form" novalidate>
          <div class="seg" id="seg">
            <button type="button" data-type="expense" class="active" data-i18n="expense"></button>
            <button type="button" data-type="income" data-i18n="income"></button>
          </div>
          <div class="form-row">
            <label for="amount" data-i18n="amount"></label>
            <input id="amount" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0" required />
          </div>
          <div class="two">
            <div class="form-row">
              <label for="category" data-i18n="category"></label>
              <select id="category" class="field"></select>
            </div>
            <div class="form-row">
              <label for="date" data-i18n="date"></label>
              <input id="date" class="field" type="date" required />
            </div>
          </div>
          <div class="form-row reveal" id="custom-row">
            <label for="custom" data-i18n="customLabel"></label>
            <input id="custom" class="field" type="text" maxlength="30" />
          </div>
          <div class="form-row">
            <label for="note" data-i18n="note"></label>
            <input id="note" class="field" type="text" maxlength="60" />
          </div>
          <div class="form-actions">
            <button class="submit" type="submit" id="submit-btn"></button>
            <button class="btn" type="button" id="cancel-btn" style="display:none" data-i18n="cancel"></button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="tx-head">
          <h2 style="margin:0" data-i18n="recent"></h2>
          <span class="hint" id="tx-count" style="margin:0"></span>
        </div>
        <div class="tx-tools">
          <button class="btn sm" id="csv-btn" data-i18n="downloadCsv"></button>
          <button class="btn sm" id="backup-btn" data-i18n="backup"></button>
          <button class="btn sm" id="restore-btn" data-i18n="restore"></button>
          <input type="file" id="restore-file" accept="application/json,.json" style="display:none" />
        </div>
        <div class="tx-list" id="tx-list"></div>
      </section>
    </div>
  </div>

  <footer><span data-i18n="footerNote"></span></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var LS_KEY = "paisatrack.v3";
  var LS_OLD = ["paisatrack.v2", "paisatrack.v1"];

  /* ============================ i18n ============================ */
  var I18N = {
    en: {
      tagline:"Personal finance & expense tracker",
      balance:"Balance", income:"Income", expenses:"Expenses", savingsRate:"Savings rate",
      ofIncomeKept:"Of income kept", inGreen:"You're in the green", overspend:"Spending exceeds income",
      credits:"credit entries", debits:"debit entries",
      cashFlow:"Cash flow", cashFlowHint:"Income vs. expenses over the last 6 months",
      whereMoney:"Where your money goes", expenseBreakdown:"Expense breakdown by category",

      amount:"Amount (₹)", category:"Category", date:"Date", note:"Note (optional)",

      thisMonth:"This month", last30:"Last 30 days", thisYear:"This year", allTime:"All time",
      downloadCsv:"Download CSV", backup:"Backup (JSON)", restore:"Restore",

      confirmClear:"Delete all transactions? This cannot be undone.",

      badFile:"That file could not be read.", restored:"Data restored.",
      exportedCsv:"CSV downloaded.", exportedJson:"Backup downloaded.",
      added:"Added.", updated:"Updated.", deleted:"Deleted.",
      footerNote:"Built as a Micro-SaaS starter · 100% client-side — your data never leaves this browser",
      k:"k", lac:"L", cr:"Cr", otherLabel:"Other"
    },
    hi: {
      tagline:"पर्सनल फाइनेंस और खर्च ट्रैकर",

      ofIncomeKept:"आय का बचाया हिस्सा", inGreen:"आप फ़ायदे में हैं", overspend:"खर्च आय से ज़्यादा है",

  var MON_HI_SHORT = ["जन","फ़र","मार्च","अप्रैल","मई","जून","जुल","अग","सित","अक्तू","नव","दिस"];
  var MON_HI_FULL  = ["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];

  function T(k){ return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
  function catDef(type, key){
    var list = CATS[type] || [];
    for(var i=0;i<list.length;i++){ if(list[i].key === key) return list[i]; }
    return null;
  }
  function isOther(tx){ return !!OTHER_KEYS[tx.category]; }
  function labelFor(tx){
    if(isOther(tx) && tx.custom) return tx.custom;
    var d = catDef(tx.type, tx.category);
    return d ? (d[lang] || d.en) : (tx.category || "—");
  }
  function labelEn(tx){
    if(isOther(tx) && tx.custom) return tx.custom;
    var d = catDef(tx.type, tx.category);
    return d ? d.en : (tx.category || "Other");
  }
  function iconFor(tx){
    if(isOther(tx) && tx.custom) return "🏷️";
    var d = catDef(tx.type, tx.category);
    return d ? d.icon : (tx.type === "income" ? "➕" : "📦");
  }

  /* ============================ helpers ============================ */
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
  function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }
  function money(n){ return new Intl.NumberFormat(lang === "hi" ? "hi-IN" : "en-IN", {style:"currency", currency:"INR", maximumFractionDigits:0}).format(Math.round(n)); }
  function short(n){
    var a = Math.abs(n), L = I18N[lang];
    if(a >= 1e7) return "₹" + (n/1e7).toFixed(a >= 1e8 ? 0 : 1) + L.cr;
    if(a >= 1e5) return "₹" + (n/1e5).toFixed(a >= 1e6 ? 0 : 1) + L.lac;
    if(a >= 1e3) return "₹" + (n/1e3).toFixed(a >= 1e4 ? 0 : 1) + L.k;
    return "₹" + Math.round(n);
  }
  function monthShort(d){ return lang === "hi" ? MON_HI_SHORT[d.getMonth()] : d.toLocaleDateString("en-IN", {month:"short"}); }
  function fmtDate(s){
    var d = new Date(s + "T00:00:00");
    if(isNaN(d.getTime())) return s;
    if(lang === "hi") return d.getDate() + " " + MON_HI_FULL[d.getMonth()] + " " + d.getFullYear();
    return d.toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
  }
  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1900);
  }
  function download(filename, text, mime){
    var blob = new Blob([text], {type: mime || "text/plain;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  /* ============================ storage ============================ */
  function normalize(t){
    if(!t || typeof t !== "object") return null;
    var type = t.type === "income" ? "income" : "expense";
    var amount = Number(t.amount);
    if(!isFinite(amount) || amount <= 0) return null;
    var category = t.category || (type === "income" ? "other_income" : "other");
    if(!catDef(type, category)) category = type === "income" ? "other_income" : "other";
    var date = (typeof t.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(t.date)) ? t.date : iso(new Date());
    return {
      id: t.id || uid(), type:type, amount:amount, category:category,
      custom: typeof t.custom === "string" ? t.custom.slice(0,30) : "",
      date:date, note: String(t.note || "").slice(0,60)
    };
  }
  function save(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({version:3, lang:lang, tx:state.tx})); }catch(e){}
  }
  function load(){
    var raw = null, i;
    try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
    if(!raw){ for(i=0;i<LS_OLD.length && !raw;i++){ try{ raw = localStorage.getItem(LS_OLD[i]); }catch(e){} } }
    if(!raw) return;
    try{
      var d = JSON.parse(raw);
      if(d && Array.isArray(d.tx)){
        state.tx = d.tx.map(normalize).filter(Boolean);
      }
      if(d && (d.lang === "hi" || d.lang === "en")) lang = d.lang;
    }catch(e){ state.tx = []; }
  }

  /* ============================ sample data ============================ */
  function sampleData(){
    var out = [], now = new Date();
    function add(mo, day, type, amount, category, note){
      var d = new Date(now.getFullYear(), now.getMonth() - mo, day);
      out.push({ id:uid(), type:type, amount:amount, category:category, custom:"", date:iso(d), note:note || "" });
    }
    for(var m=5;m>=0;m--){
      add(m, 1,  "income",  65000, "salary",        "Monthly salary");
      add(m, 8,  "expense", 18000, "rent",          "House rent");
      add(m, 12, "expense", 5200,  "groceries",     "Monthly groceries");
      add(m, 15, "expense", 1450,  "bills",         "Electricity + internet");
      add(m, 18, "expense", 2400,  "transport",     "Cab & fuel");
      add(m, 20, "expense", 1800,  "food",          "Eating out");
      if(m % 2 === 0) add(m, 22, "expense", 3200, "shopping", "Clothes");
      if(m === 4 || m === 1) add(m, 25, "income", 12000, "freelance", "Side project");
      if(m === 3) add(m, 10, "expense", 2500, "health", "Checkup");
      if(m === 2) add(m, 5,  "expense", 4000, "entertainment", "Weekend trip");
      if(m === 1){ var e = out[out.length-1]; }
    }
    out.push({ id:uid(), type:"expense", amount:1500, category:"other", custom:"Pet care", date:iso(new Date(now.getFullYear(), now.getMonth(), 6)), note:"Vet visit" });
    return out;
  }

  /* ============================ period ============================ */
  function periodStart(){
    var v = document.getElementById("period").value;
    var now = new Date(); now.setHours(0,0,0,0);
    if(v === "month") return new Date(now.getFullYear(), now.getMonth(), 1);
    if(v === "30"){ var d = new Date(now); d.setDate(d.getDate() - 29); return d; }
    if(v === "year") return new Date(now.getFullYear(), 0, 1);
    return null;
  }
  function inPeriod(s){
    var p = periodStart();
    if(!p) return true;
    var d = new Date(s + "T00:00:00");
    return !isNaN(d.getTime()) && d >= p;
  }

  /* ============================ i18n apply ============================ */
  function applyI18n(){
    document.documentElement.lang = lang;
    document.title = "PaisaTrack — " + T("tagline");
    var nodes = document.querySelectorAll("[data-i18n]"), i;
    for(i=0;i<nodes.length;i++){
      var k = nodes[i].getAttribute("data-i18n");
      if(I18N[lang][k] !== undefined) nodes[i].textContent = T(k);
    }
    document.getElementById("custom").placeholder = T("customPlaceholder");
    document.getElementById("note").placeholder = lang === "hi" ? "जैसे टीम के साथ लंच" : "e.g. Lunch with team";
    document.getElementById("lang").value = lang;
    syncCustomVisibility();
  }

  /* ============================ custom category ============================ */
  function currentIsOther(){ return !!OTHER_KEYS[document.getElementById("category").value]; }
  function syncCustomVisibility(){
    var row = document.getElementById("custom-row");
    var show = currentIsOther();
    row.classList.toggle("open", show);
    row.setAttribute("aria-hidden", show ? "false" : "true");
  }

  /* ============================ rendering ============================ */
  function render(){
    var filtered = state.tx.filter(function(t){ return inPeriod(t.date); });
    var income = 0, expense = 0, nIn = 0, nOut = 0;
    filtered.forEach(function(t){
      if(t.type === "income"){ income += t.amount; nIn++; } else { expense += t.amount; nOut++; }
    });
    var balance = income - expense;
    var rate = income > 0 ? Math.round((balance / income) * 100) : 0;

    document.getElementById("s-balance").textContent = money(balance);
    document.getElementById("s-income").textContent = money(income);
    document.getElementById("s-expense").textContent = money(expense);
    document.getElementById("s-save").textContent = rate + "%";
    document.getElementById("s-balance-sub").textContent = balance >= 0 ? T("inGreen") : T("overspend");
    document.getElementById("s-income-sub").textContent = nIn + " " + T("credits");
    document.getElementById("s-expense-sub").textContent = nOut + " " + T("debits");

    renderDonut(filtered);
    renderBars();
    renderList();
  }

  function renderDonut(filtered){
    var map = {}, total = 0;
    filtered.forEach(function(t){
      if(t.type !== "expense") return;
      var name = labelFor(t);
      map[name] = (map[name] || 0) + t.amount;
      total += t.amount;
    });
    var entries = Object.keys(map).map(function(k){ return { name:k, value:map[k] }; })
                        .sort(function(a,b){ return b.value - a.value; });

    var svg = document.getElementById("donut");
    var list = document.getElementById("cat-list");

    if(total <= 0){
      svg.innerHTML = '<circle cx="90" cy="90" r="62" fill="none" stroke="#eef1f7" stroke-width="26"/>' +
                      '<text x="90" y="90" text-anchor="middle" class="donut-center">' + esc(T("noExpenses")) + '</text>';
      list.innerHTML = '<div class="empty">' + esc(T("addExpenseHint")) + '</div>';
      return;
    }

    var r = 62, C = 2 * Math.PI * r, offset = 0, parts = [];
    entries.forEach(function(e, i){
      var len = (e.value / total) * C;
      var color = CAT_COLORS[i % CAT_COLORS.length];
      parts.push('<circle class="seg" cx="90" cy="90" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="26" ' +
                 'stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" ' +
                 'stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 90 90)"><title>' +
                 esc(e.name) + ': ' + money(e.value) + '</title></circle>');
      offset += len;
    });
    svg.innerHTML = parts.join("") +
      '<text x="90" y="84" text-anchor="middle" class="donut-center">' + esc(T("totalSpent")) + '</text>' +
      '<text x="90" y="105" text-anchor="middle" class="donut-center-amt">' + short(total) + '</text>';

    list.innerHTML = entries.slice(0, 8).map(function(e, i){
      var pct = Math.round((e.value / total) * 100);
      return '<div class="cat-row" style="animation-delay:' + (i * 0.04) + 's">' +
               '<span class="swatch" style="background:' + CAT_COLORS[i % CAT_COLORS.length] + '"></span>' +
               '<span class="name">' + esc(e.name) + '</span>' +
               '<span class="amt">' + money(e.value) + '</span>' +
               '<span class="pct">' + pct + '%</span>' +
             '</div>';
    }).join("");
  }

  function renderBars(){
    var svg = document.getElementById("bars");
    var W = 640, H = 230, padL = 74, padR = 12, padT = 14, padB = 34;
    var plotW = W - padL - padR, plotH = H - padT - padB;

    var now = new Date(), months = [], i;
    for(i=5;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"), label: monthShort(d), income:0, expense:0 });
    }
    var idx = {};
    months.forEach(function(m,j){ idx[m.key] = j; });
    state.tx.forEach(function(t){
      var k = (t.date || "").slice(0,7);
      if(idx[k] === undefined) return;
      months[idx[k]][t.type === "income" ? "income" : "expense"] += t.amount;
    });

    var max = 0;
    months.forEach(function(m){ max = Math.max(max, m.income, m.expense); });
    var top = 1;
    if(max > 0){
      var step = Math.pow(10, Math.floor(Math.log(max) / Math.LN10)) / 2;
      top = Math.ceil(max / step) * step;
    }

    var parts = [], ticks = 4, g;
    for(g=0; g<=ticks; g++){
      var y = padT + plotH - (plotH * g / ticks);
      parts.push('<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W-padR) + '" y2="' + y.toFixed(1) + '" stroke="#eef1f7" stroke-width="1"/>');
      parts.push('<text x="' + (padL-8) + '" y="' + (y+4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="#9aa3b6">' + esc(short(top * g / ticks)) + '</text>');
    }

    var groupW = plotW / months.length, barW = Math.min(20, groupW * 0.28), gap = 5;
    months.forEach(function(m, j){
      var cx = padL + groupW * j + groupW / 2;
      var xI = cx - barW - gap/2, xE = cx + gap/2;
      var hI = (m.income / top) * plotH, hE = (m.expense / top) * plotH;
      var baseY = padT + plotH, dly = (j * 0.05).toFixed(2);
      parts.push('<rect class="bar" style="animation-delay:' + dly + 's" x="' + xI.toFixed(1) + '" y="' + (baseY-hI).toFixed(1) + '" width="' + barW + '" height="' + Math.max(hI,0).toFixed(1) + '" rx="4" fill="var(--income)"><title>' + esc(m.label) + " " + esc(T("income")) + ': ' + money(m.income) + '</title></rect>');
      parts.push('<rect class="bar" style="animation-delay:' + dly + 's" x="' + xE.toFixed(1) + '" y="' + (baseY-hE).toFixed(1) + '" width="' + barW + '" height="' + Math.max(hE,0).toFixed(1) + '" rx="4" fill="var(--expense)"><title>' + esc(m.label) + " " + esc(T("expenses")) + ': ' + money(m.expense) + '</title></rect>');
      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H-12) + '" text-anchor="middle" font-size="11.5" fill="#6b7488">' + esc(m.label) + '</text>');
    });
    svg.innerHTML = parts.join("");
  }

  function renderList(){
    var list = document.getElementById("tx-list");
    var items = state.tx.slice().sort(function(a,b){ return (b.date + b.id).localeCompare(a.date + a.id); });
    document.getElementById("tx-count").textContent = items.length + " " + (items.length === 1 ? T("item") : T("items"));

    if(!items.length){
      list.innerHTML = '<div class="empty"><span class="big">🧾</span>' + esc(T("noTx")) + '<br>' + esc(T("addFirst")) + '</div>';
      return;
    }
    list.innerHTML = items.slice(0, 80).map(function(t){
      var isIn = t.type === "income";
      var bg = isIn ? "#e7f8f1" : "#f1f2ff";
      return '<div class="tx' + (t.id === editingId ? " editing" : "") + '" data-id="' + t.id + '">' +
        '<div class="icon" style="background:' + bg + '">' + iconFor(t) + '</div>' +
        '<div class="mid">' +
          '<div class="cat">' + esc(labelFor(t)) + '</div>' +
          '<div class="meta">' + esc(fmtDate(t.date)) + (t.note ? " · " + esc(t.note) : "") + '</div>' +
        '</div>' +
        '<div class="amt ' + (isIn ? "in" : "out") + '">' + (isIn ? "+" : "−") + money(t.amount) + '</div>' +
        '<button class="del" title="Delete" data-del="' + t.id + '">✕</button>' +
      '</div>';
    }).join("");
  }

  /* ============================ form ============================ */
  function fillCategories(){
    var sel = document.getElementById("category");
    var list = CATS[formType] || [];
    sel.innerHTML = list.map(function(c){
      return '<option value="' + esc(c.key) + '">' + esc(c.icon + " " + (c[lang] || c.en)) + '</option>';
    }).join("");
  }
  function setType(t){
    formType = t;
    var bs = document.querySelectorAll("#seg button");
    for(var i=0;i<bs.length;i++) bs[i].classList.toggle("active", bs[i].getAttribute("data-type") === t);
    fillCategories();
    updateSubmitLabel();
    syncCustomVisibility();
  }
  function updateSubmitLabel(){
    var b = document.getElementById("submit-btn");
    if(editingId) b.textContent = T("update");
    else b.textContent = formType === "income" ? T("addIncome") : T("addExpense");
  }
  function resetForm(){
    editingId = null;
    document.getElementById("form").reset();
    document.getElementById("date").value = iso(new Date());
    document.getElementById("cancel-btn").style.display = "none";
    document.getElementById("form-title").textContent = T("addTransaction");
    setType(formType);
    renderList();
  }
  function startEdit(id){
    var t = null, i;
    for(i=0;i<state.tx.length;i++){ if(state.tx[i].id === id){ t = state.tx[i]; break; } }
    if(!t) return;
    editingId = id;
    formType = t.type;
    var bs = document.querySelectorAll("#seg button");
    for(i=0;i<bs.length;i++) bs[i].classList.toggle("active", bs[i].getAttribute("data-type") === t.type);
    fillCategories();
    document.getElementById("amount").value = t.amount;
    document.getElementById("category").value = t.category;
    document.getElementById("custom").value = t.custom || "";
    document.getElementById("date").value = t.date;
    document.getElementById("note").value = t.note || "";
    document.getElementById("cancel-btn").style.display = "";
    document.getElementById("form-title").textContent = T("editTransaction");
    updateSubmitLabel();
    syncCustomVisibility();
    renderList();
    document.getElementById("amount").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ============================ export / import ============================ */
  function exportCsv(){
    if(!state.tx.length){ toast(T("noTx")); return; }
    var rows = [["Date","Type","Category","Amount","Note"]];
    state.tx.slice().sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(t){
      rows.push([t.date, t.type, labelEn(t), String(t.amount), t.note || ""]);
    });
    var csv = rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\r\n");
    download("paisatrack-transactions.csv", "\uFEFF" + csv, "text/csv;charset=utf-8");
    toast(T("exportedCsv"));
  }
  function exportJson(){
    if(!state.tx.length){ toast(T("noTx")); return; }
    download("paisatrack-backup.json", JSON.stringify({version:3, exportedAt:new Date().toISOString(), lang:lang, tx:state.tx}, null, 2), "application/json");
    toast(T("exportedJson"));
  }
  function importJson(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var d = JSON.parse(String(reader.result));
        var arr = Array.isArray(d) ? d : (d && Array.isArray(d.tx) ? d.tx : null);
        if(!arr) throw new Error("bad");
        var clean = arr.map(normalize).filter(Boolean);
        if(!clean.length) throw new Error("empty");
        state.tx = clean;
        save(); resetForm(); render();
        toast(T("restored"));
      }catch(e){ toast(T("badFile")); }
    };
    reader.onerror = function(){ toast(T("badFile")); };
    reader.readAsText(file);
  }

  /* ============================ events ============================ */
  function bind(){
    document.getElementById("lang").addEventListener("change", function(e){
      lang = e.target.value === "hi" ? "hi" : "en";
      applyI18n(); save(); render(); resetForm();
    });

    document.getElementById("seg").addEventListener("click", function(e){
      var b = e.target.closest("button[data-type]");
      if(b) setType(b.getAttribute("data-type"));
    });

    document.getElementById("category").addEventListener("change", syncCustomVisibility);
    document.getElementById("period").addEventListener("change", render);

    document.getElementById("form").addEventListener("submit", function(e){
      e.preventDefault();
      var amt = parseFloat(document.getElementById("amount").value);
      var date = document.getElementById("date").value;
      if(!(amt > 0)){ document.getElementById("amount").focus(); return; }
      if(!date){ document.getElementById("date").focus(); return; }
      var cat = document.getElementById("category").value;
      var custom = OTHER_KEYS[cat] ? document.getElementById("custom").value.trim().slice(0,30) : "";
      var payload = { type:formType, amount:amt, category:cat, custom:custom, date:date, note:document.getElementById("note").value.trim() };

      if(editingId){
        for(var i=0;i<state.tx.length;i++){
          if(state.tx[i].id === editingId){
            state.tx[i].type = payload.type; state.tx[i].amount = payload.amount;
            state.tx[i].category = payload.category; state.tx[i].custom = payload.custom;
            state.tx[i].date = payload.date; state.tx[i].note = payload.note;
          }
        }
        save(); resetForm(); render(); toast(T("updated"));
      }else{
        payload.id = uid();
        state.tx.push(payload);
        save();
        document.getElementById("form").reset();
        document.getElementById("date").value = iso(new Date());
        setType(formType);
        render();
        document.getElementById("amount").focus();
        toast(T("added"));
      }
    });

    document.getElementById("cancel-btn").addEventListener("click", function(){ resetForm(); });

    document.getElementById("tx-list").addEventListener("click", function(e){
      var del = e.target.closest("button[data-del]");
      if(del){
        e.stopPropagation();
        var did = del.getAttribute("data-del");
        state.tx = state.tx.filter(function(t){ return t.id !== did; });
        if(editingId === did) resetForm();
        save(); render(); toast(T("deleted"));
        return;
      }
      var row = e.target.closest(".tx[data-id]");
      if(row) startEdit(row.getAttribute("data-id"));
    });

    document.getElementById("reset").addEventListener("click", function(){
      if(!state.tx.length) return;
      if(window.confirm(T("confirmClear"))){ state.tx = []; save(); resetForm(); render(); }
    });

    document.getElementById("sample").addEventListener("click", function(){
      if(state.tx.length && !window.confirm(T("confirmSample"))) return;
      state.tx = sampleData(); save(); resetForm(); render();
    });

    document.getElementById("csv-btn").addEventListener("click", exportCsv);
    document.getElementById("backup-btn").addEventListener("click", exportJson);
    document.getElementById("restore-btn").addEventListener("click", function(){ document.getElementById("restore-file").click(); });
    document.getElementById("restore-file").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(f) importJson(f);
      e.target.value = "";
    });
  }

  /* ============================ init ============================ */
  function init(){
    load();
    try{
      var q = new URLSearchParams(window.location.search).get("lang");
      if(q === "hi" || q === "en") lang = q;
    }catch(e){}
    bind();
    applyI18n();
    setType("expense");
    document.getElementById("date").value = iso(new Date());
    render();
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
